name: Build & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check package.json version
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    outputs:
      version: ${{ steps.check.outputs.version }}
      should_release: ${{ steps.check.outputs.should_release }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Determine if this version has already been released
        id: check
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: ubuntu-latest
            platform: linux
            builder-flags: --linux
          - os: windows-latest
            platform: windows
            builder-flags: --win

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Typecheck & Tests
        run: |
          bun run typecheck
          bun run test

      - name: Build Application
        run: bun run build

      - name: Exclude dist from Windows Defender
        if: runner.os == 'Windows'
        shell: powershell
        run: Add-MpPreference -ExclusionPath "${{ github.workspace }}\dist"

      - name: Package with electron-builder
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: bun run electron-builder ${{ matrix.builder-flags }} --publish never

      - name: List dist contents
        shell: bash
        run: ls -la dist

      - name: Sanity-check artifact sizes
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob
          for f in *.AppImage *.deb *.tar.gz *.exe; do
            [[ "$f" == *__uninstaller.exe ]] && continue
            size=$(stat -c%s "$f" 2>/dev/null || stat -f%z "$f")
            echo "$f: $size bytes"
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$f is only $size bytes — build likely corrupted"
              exit 1
            fi
          done

      - name: Generate SHA256 checksums
        working-directory: dist
        shell: bash
        run: |
          shopt -s nullglob
          files=()
          for f in *.AppImage *.deb *.tar.gz *.exe; do
            [[ "$f" == *__uninstaller.exe ]] && continue
            files+=("$f")
          done
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release artifacts found to checksum"
            exit 1
          fi
          sha256sum "${files[@]}" > "SHA256SUMS-${{ matrix.platform }}.txt"
          cat "SHA256SUMS-${{ matrix.platform }}.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: slip-sound-${{ matrix.platform }}-binaries
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.exe
            !dist/*__uninstaller.exe
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: [check-version, build]
    runs-on: ubuntu-latest
    if: needs.check-version.outputs.should_release == 'true'
    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: slip-sound-*-binaries
          path: dist
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la dist

      - name: Publish Release Assets to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.check-version.outputs.version }}
          target_commitish: ${{ github.sha }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.AppImage
            dist/*.deb
            dist/*.tar.gz
            dist/*.exe
            !dist/*__uninstaller.exe
            dist/latest*.yml
            dist/SHA256SUMS-*.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
